[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/io",
    "crates/ui-egui",
    "apps/rackcraft",
]
default-members = [
    "crates/engine",
    "crates/io",
    "crates/ui-egui",
    "apps/rackcraft",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/emilio-n8n/rackcraft"
rust-version = "1.95"
authors = ["RackCraft contributors"]

[workspace.dependencies]
rackcraft-engine = { path = "crates/engine" }
rackcraft-io = { path = "crates/io" }
rackcraft-ui = { path = "crates/ui-egui" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
kurbo = { version = "0.13", features = ["serde"] }
roxmltree = "0.21"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
cfb = "0.16"
rust_xlsxwriter = "0.103"
csv = "1.3"
tempfile = "3"
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
    "accesskit",
    "clipboard",
    "links",
] }
rfd = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 1
